name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.1). Leave empty to use pubspec.yaml"
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/backend/coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  mobile-release:
    name: Mobile Release Build (Android)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
      - run: flutter pub get
      - name: Resolve version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          VERSION_NAME="${INPUT_VERSION_NAME:-$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "### Android release $VERSION_NAME ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
      - run: |
          flutter build appbundle --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL=https://tunetrend-api.onrender.com
      - run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL=https://tunetrend-api.onrender.com
      - name: Upload Dart debug symbols (for flutter symbolize)
        uses: actions/upload-artifact@v4
        with:
          name: dart-debug-symbols-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          path: apps/mobile/build/symbols
          retention-days: 90
      - name: Upload release AAB (for Play Console upload)
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
      - name: Upload release APK (for manual/sideload testing)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
