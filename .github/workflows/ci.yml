name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so a deploy run never shares a group with a PR run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  commits:
    name: Commit messages
    # Advisory only: non-conventional messages are reported as warnings and never fail CI.
    # Uses the repo commitlint config.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          check_msg() { npx --no-install commitlint --edit "$1"; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            set -- "$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$' && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            set -- "$PUSH_BEFORE..$PUSH_SHA"
          else
            set -- --max-count=20 "$PUSH_SHA"
          fi
          bad=0
          for sha in $(git rev-list "$@"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! check_msg "$RUNNER_TEMP/msg"; then
              echo "::warning::$sha does not follow the commit convention: $(head -n 1 "$RUNNER_TEMP/msg")"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then echo "::notice::Commit message check is advisory and does not fail CI."; fi

  check-frontend:
    name: Check Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json
      # Root tooling (prettier, commitlint).
      - name: Install dependencies
        run: npm ci
      # Prettier, repo-wide.
      - name: Format check
        run: npm run format:check
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Lint
        working-directory: apps/frontend
        run: npm run lint
      - name: Build
        working-directory: apps/frontend
        run: npm run build

  check-backend:
    name: Check Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Install dependencies
        run: go mod download
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: Lint
        run: go vet ./...
      - name: Test
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Build
        run: go build ./...
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/backend/coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  check-mobile:
    name: Check Mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      # Deprecation infos (showcaseview v5 API) are pre-existing; warnings/errors stay fatal.
      - name: Lint
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      # shortcut: existing advisories GHSA-68fv-2mgg-jv7q (source-map-js), remove after dependabot bumps
      # Frontend.
      - name: Audit dependencies
        continue-on-error: true
        working-directory: apps/frontend
        run: npm audit --audit-level=high --omit=dev
      # shortcut: existing advisories GO-2026-6888 (andybalholm/brotli), remove after dependabot bumps
      # Backend.
      - name: Audit dependencies
        continue-on-error: true
        working-directory: apps/backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Flutter/pub: no first-party vulnerability scanner; covered by dependabot only.
