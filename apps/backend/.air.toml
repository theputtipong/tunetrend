#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  # 1. 🟢 แก้ cmd: สั่งรัน Swagger ให้เสร็จก่อน แล้วค่อย Build โค้ดจาก cmd/api/main.go
  cmd = "swag init -g cmd/api/main.go --parseDependency --parseInternal && go build -o ./tmp/main ./cmd/api/main.go"
  delay = 1000
  entrypoint = ["./tmp/main"]
  # 2. 🟢 แก้ exclude_dir: เพิ่ม "docs" เข้าไป เพื่อป้องกันการโหลดซ้ำวนลูปเวลาไฟล์ Swagger มีการเปลี่ยนแปลง
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  ignore_dangerous_root_dir = false
  include_dir = []
  # 3. 🟢 แก้ include_ext: เพิ่ม "env" เข้าไป เพื่อให้ตอนเราแก้ไฟล์ .env เซิร์ฟเวอร์ก็จะรีสตาร์ทให้ด้วย
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true