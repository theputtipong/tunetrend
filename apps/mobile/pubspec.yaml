name: tunetrend_mobile
description: "Trending YouTube Music videos by country."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  google_fonts: ^9.0.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  youtube_player_iframe: ^6.0.2
  showcaseview: ^5.1.0
  share_plus: ^13.3.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_remote_config: ^7.0.1
  firebase_analytics: ^13.0.1
  firebase_performance: ^0.12.1
  firebase_performance_dio: ^0.7.1
  dio: ^5.11.1
  cached_network_image: ^4.0.6
  shimmer: ^4.0.0
  package_info_plus: ^10.2.2
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.0
  lottie: ^3.8.2
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#ff7a47"

flutter:

  uses-material-design: true

  assets:
    - assets/icon/
    - assets/lottie/
    - shorebird.yaml

